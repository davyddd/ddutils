[project]
name = "ddutils"
description = "Domain Driven Utils Library"
version = "0.1.6"
authors = [{ name = "davyddd" }]
license = "MIT"
license-files = ["LICENSE"]
readme = "README.md"
requires-python = ">=3.9,<3.15"
keywords = ["python", "ddutils"]
dependencies = []

[project.urls]
Repository = "https://github.com/davyddd/ddutils"

[dependency-groups]
dev = [
    "ipdb==0.13.13",
    "ipython==8.12.3",  # ipython 9 requires Python >= 3.11
]
test = [
    "pytest==8.1.1",  # pytest 9 requires Python >= 3.10
    "pytest-cov==5.0.0",
    "parameterized==0.9.0",
    "typing-extensions>=4.12.2,<5",
]
linter = [
    "ruff==0.15.10",
    "ty==0.0.15",
    "complexipy==8.0.1",
]

[tool.uv.build-backend]
module-root = ""

[build-system]
requires = ["uv_build>=0.12.0,<0.13.0"]
build-backend = "uv_build"
